name: Prueba reproducible

# Ejecuta pruebas/prueba_reproducible.py en un Windows limpio con las versiones
# fijadas en requirements.txt cada vez que cambia el código.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prueba:
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar la prueba reproducible
        env:
          PYTHONIOENCODING: utf-8
        run: python pruebas/prueba_reproducible.py
